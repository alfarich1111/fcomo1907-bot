<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="chelsea.css">
<style>
  .big { position: absolute; top: 236px; left: 80px; right: 80px; display: flex; align-items: baseline; gap: 34px; font-size: 200px; }
  .big .gold { font-size: 84px; letter-spacing: 10px; }
  .kicker { top: 440px; }
  .vsbg { position: absolute; top: 560px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue', sans-serif;
    font-size: 760px; line-height: 1; color: transparent; -webkit-text-stroke: 4px rgba(229,180,59,.45); }
  /* Studio portraits (head to waist, transparent background), standing on the team bar. */
  .cut.l, .cut.r { top: 520px; width: 800px; height: 940px; object-fit: contain; object-position: bottom center;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,.45));
    -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); }
  .cut.l { left: -10px; } .cut.r { right: -10px; }
  .bar { left: 80px; right: 80px; top: 1440px; height: 160px; display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; padding: 0 40px; }
  .team { display: flex; align-items: center; gap: 26px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; white-space: nowrap; }
  .team.r { justify-content: flex-end; }
  .logo { width: 104px; height: 104px; flex: none; background: #fff; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 0 0 5px rgba(229,180,59,.8); }
  .logo img { width: 74px; height: 74px; object-fit: contain; }
  .vs { font-family: 'Bebas Neue', sans-serif; font-size: 90px; color: #e5b43b; padding: 0 30px; }
  .info { left: 80px; right: 80px; top: 1630px; height: 300px; display: grid; grid-template-columns: 1.1fr 1fr 1fr;
    align-items: center; padding: 0 56px; }
  .time { font-family: 'Bebas Neue', sans-serif; font-size: 160px; line-height: .9; }
  .time small { display: block; font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 6px;
    color: #e5b43b; text-transform: uppercase; }
  .stack .stat + .stat { margin-top: 30px; }
</style></head>
<body>
  <img class="crest-wm" src="https://a.espncdn.com/i/teamlogos/soccer/500/363.png">
  <div class="topbar">
    <div class="brand"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/363.png">CHELSEA UZ</div>
    <div class="when">$date<small>$weekday</small></div>
  </div>
  <div class="goldline" style="top:196px"></div>
  <div class="big display">Matchday<span class="gold">O'yin kuni</span></div>
  <div class="kicker">$kicker</div>
  <div class="vsbg">VS</div>
  $left_img
  $right_img
  <div class="panel bar">
    <div class="team"><div class="logo"><img src="$home_logo"></div><span style="font-size:$home_fs">$home</span></div>
    <div class="vs">VS</div>
    <div class="team r"><span style="font-size:$away_fs">$away</span><div class="logo"><img src="$away_logo"></div></div>
  </div>
  <div class="panel info">
    <div class="time">$time<small>$tz vaqti bilan</small></div>
    <div class="stack"><div class="stat"><div class="lbl">$l_stadium</div><div class="val">$stadium</div></div>
      <div class="stat"><div class="lbl">$l_table</div><div class="val">$table</div></div></div>
    <div class="stat"><div class="lbl">$l_form</div><div class="chips">$form</div></div>
  </div>
</body></html>
