<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="chelsea.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&display=block">
<style>
  /* Full-bleed photo with the fixture written on top of it, like the result poster ("O'yin kuni" / "Keyingi o'yin"). */
  body { background: #021c4f; }
  .photo { position: absolute; inset: 0; width: 1600px; height: 2000px; object-fit: cover; object-position: center 25%; }
  .shade { position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 50% at 88% 14%, rgba(2,12,40,.6), transparent 70%),
                linear-gradient(to bottom, rgba(2,12,40,.35), transparent 22%, transparent 78%, rgba(2,12,40,.6)); }
  .res { position: absolute; top: 70px; right: 90px; width: 700px; text-align: center; color: #fff;
    text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  .crests { display: flex; justify-content: center; align-items: center; gap: 34px; }
  .crests .c { width: 196px; height: 196px; border-radius: 50%; background: rgba(255,255,255,.94); display: flex;
    align-items: center; justify-content: center; box-shadow: 0 0 0 5px rgba(229,180,59,.9), 0 16px 40px rgba(0,0,0,.45); }
  .crests .c img { width: 136px; height: 136px; object-fit: contain; }
  .crests .sep { width: 3px; height: 120px; background: linear-gradient(transparent, #e5b43b, transparent); }
  .time { font-family: 'Bodoni Moda', Georgia, serif; font-weight: 700; font-size: 250px; line-height: 1; margin-top: 40px;
    white-space: nowrap; }
  .tz { font-size: 26px; font-weight: 800; letter-spacing: 8px; text-transform: uppercase; color: #e5b43b; margin-top: 4px; }
  .lbl { display: inline-block; margin-top: 30px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 40px;
    line-height: 1; letter-spacing: 12px; text-transform: uppercase; padding: 16px 10px 16px 22px;
    border-top: 3px solid #e5b43b; border-bottom: 3px solid #e5b43b; }
  .kick { margin-top: 22px; font-size: 26px; font-weight: 800; letter-spacing: 7px; text-transform: uppercase; opacity: .9; }
  .brand { position: absolute; left: 80px; bottom: 113px; }
  .brand .tag { height: 54px; filter: drop-shadow(0 4px 14px rgba(0,0,0,.6)); }
  .comp-logo { position: absolute; right: 80px; bottom: 70px; height: 140px; max-width: 280px; object-fit: contain;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,.5)); }
</style></head>
<body>
  $photo
  <div class="shade"></div>
  <div class="res">
    <div class="crests"><div class="c"><img src="$home_logo"></div><div class="sep"></div><div class="c"><img src="$away_logo"></div></div>
    <div class="time">$time</div>
    <div class="tz">$tz vaqti bilan</div>
    <div class="lbl">$label</div>
    <div class="kick">$kicker</div>
  </div>
  <div class="brand"><img class="tag" src="../assets/cfc_uz_at.png"></div>
  $comp_logo
</body></html>
