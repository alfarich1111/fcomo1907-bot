<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="chelsea.css">
<style>
  .topbar .comp { display: flex; align-items: center; gap: 30px; }
  .topbar .kick { font-size: 30px; font-weight: 800; letter-spacing: 9px; text-transform: uppercase; color: #e5b43b; text-align: right; }
  .comp-logo { height: 150px; max-width: 260px; object-fit: contain; }
  .time { position: absolute; top: 214px; left: 80px; right: 80px; display: flex; align-items: baseline; gap: 34px; }
  .time b { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 250px; line-height: .9; letter-spacing: 4px; }
  .time span { font-size: 30px; font-weight: 800; letter-spacing: 9px; color: #e5b43b; text-transform: uppercase; }
  /* Both clubs' crests, large and faint, behind their players. */
  .crest-bg { position: absolute; top: 560px; width: 700px; height: 700px; object-fit: contain; opacity: .16; }
  .crest-bg.l { left: 30px; } .crest-bg.r { right: 30px; }
  /* Studio portraits (head to waist, transparent background), standing on the team bar. */
  .cut.l, .cut.r { top: 500px; width: 800px; height: 960px; object-fit: contain; object-position: bottom center;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,.45));
    -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); }
  .cut.l { left: -10px; } .cut.r { right: -10px; }
  /* Channel logo between the players, over both portraits: it can't be cropped off without ruining the poster. */
  .own { position: absolute; left: 650px; top: 900px; width: 300px; height: 300px; z-index: 3;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.55)); }
  .bar { left: 80px; right: 80px; top: 1440px; height: 160px; display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; padding: 0 40px; z-index: 4; }
  .team { display: flex; align-items: center; gap: 26px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; white-space: nowrap; }
  .team.r { justify-content: flex-end; }
  .logo { width: 104px; height: 104px; flex: none; background: #fff; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 0 0 5px rgba(229,180,59,.8); }
  .logo img { width: 74px; height: 74px; object-fit: contain; }
  .vs { font-family: 'Bebas Neue', sans-serif; font-size: 90px; color: #e5b43b; padding: 0 30px; }
  .md { left: 80px; right: 80px; top: 1630px; height: 290px; display: flex; align-items: center; justify-content: center; gap: 40px; }
  .md b { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 230px; line-height: 1; letter-spacing: 6px; }
  .md span { font-family: 'Bebas Neue', sans-serif; font-size: 96px; letter-spacing: 12px; color: #e5b43b; line-height: 1; }
</style></head>
<body>
  <img class="crest-bg l" src="$home_logo">
  <img class="crest-bg r" src="$away_logo">
  <div class="topbar">
    <div class="brand"><img class="lg" src="../assets/cfc_uz_logo.png"></div>
    <div class="comp"><div class="kick">$kicker</div>$comp_logo</div>
  </div>
  <div class="goldline" style="top:196px"></div>
  <div class="time"><b>$time</b><span>$tz vaqti bilan</span></div>
  $left_img
  $right_img
  <div class="panel bar">
    <div class="team"><div class="logo"><img src="$home_logo"></div><span style="font-size:$home_fs">$home</span></div>
    <div class="vs">VS</div>
    <div class="team r"><span style="font-size:$away_fs">$away</span><div class="logo"><img src="$away_logo"></div></div>
  </div>
  <div class="panel md"><b>Matchday</b><span>O'yin kuni</span></div>
</body></html>
