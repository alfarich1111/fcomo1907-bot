<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="chelsea.css">
<style>
  .big { position: absolute; top: 236px; left: 72px; font-size: 300px; }
  .big .gold { display: block; font-size: 120px; letter-spacing: 14px; margin-top: 10px; }
  .cut.l { left: -10px; top: 760px; width: 860px; height: 900px; }
  .cut.r { right: -10px; top: 760px; width: 860px; height: 900px; }
  .vsbar { position: absolute; top: 1240px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 36px; }
  .logo { width: 170px; height: 170px; background: #fff; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 0 0 8px rgba(229,180,59,.8), 0 20px 50px rgba(0,0,0,.4); }
  .logo img { width: 120px; height: 120px; object-fit: contain; }
  .vs { font-family: 'Bebas Neue', sans-serif; font-size: 120px; color: #e5b43b; }
  .names { position: absolute; top: 1440px; left: 80px; right: 80px; display: flex; justify-content: space-between;
    font-family: 'Bebas Neue', sans-serif; font-size: 96px; letter-spacing: 3px; }
  .names div { width: 46%; } .names div:last-child { text-align: right; }
  .info { left: 80px; right: 80px; top: 1600px; height: 330px; display: grid; grid-template-columns: 1.1fr 1fr 1fr;
    align-items: center; padding: 0 56px; }
  .time { font-family: 'Bebas Neue', sans-serif; font-size: 170px; line-height: .9; }
  .time small { display: block; font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 6px;
    color: #e5b43b; text-transform: uppercase; }
  .stack .stat + .stat { margin-top: 34px; }
</style></head>
<body>
  <img class="crest-wm" src="https://a.espncdn.com/i/teamlogos/soccer/500/363.png">
  <div class="topbar">
    <div class="brand"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/363.png">CHELSEA UZ</div>
    <div class="when">$date<small>$weekday</small></div>
  </div>
  <div class="goldline" style="top:196px"></div>
  <div class="big display">Matchday<span class="gold">O'yin kuni</span></div>
  <div class="kicker" style="top:690px">$kicker</div>
  $left_img
  $right_img
  <div class="vsbar">
    <div class="logo"><img src="$home_logo"></div><div class="vs">VS</div><div class="logo"><img src="$away_logo"></div>
  </div>
  <div class="names"><div style="font-size:$home_fs">$home</div><div style="font-size:$away_fs">$away</div></div>
  <div class="panel info">
    <div class="time">$time<small>$tz vaqti bilan</small></div>
    <div class="stack"><div class="stat"><div class="lbl">$l_stadium</div><div class="val">$stadium</div></div>
      <div class="stat"><div class="lbl">$l_table</div><div class="val">$table</div></div></div>
    <div class="stat"><div class="lbl">$l_form</div><div class="chips">$form</div></div>
  </div>
</body></html>
