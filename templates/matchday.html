<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .vs { position: absolute; top: 640px; left: 0; right: 0; text-align: center; font-size: 720px; font-weight: 900;
    letter-spacing: -40px; color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.28); line-height: 1; }
  .cut.l { left: 0; width: 820px; height: 1000px; top: 560px; }
  .cut.r { right: 0; width: 820px; height: 1000px; top: 540px; }
  .headline { position: absolute; top: 1555px; left: 96px; right: 96px; font-size: $hl_size; font-weight: 900;
    letter-spacing: -5px; text-transform: uppercase; line-height: 1; white-space: nowrap; }
</style></head>
<body>
  <div class="top"><div class="day">$weekday</div>
    <div class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>@fcomo1907</div>
    <div class="date">$date</div></div>
  <div class="rule" style="top:216px"></div>
  <div class="kicker" style="top:254px">$kicker</div>
  <div class="vs">VS</div>
  $left_img
  $right_img
  <div class="board">
    <div class="team"><div class="bar" style="background:$home_color"></div><div><div class="name">$home</div><div class="role">хозяева</div></div></div>
    <div class="center"><div class="big">$time</div><div class="small">$tz</div></div>
    <div class="team right"><div class="bar" style="background:$away_color"></div><div><div class="name">$away</div><div class="role">гости</div></div></div>
  </div>
  <div class="headline"><span class="hl1">$hl1</span> <span class="hl2">$hl2</span></div>
  <div class="rule" style="top:1712px"></div>
  <div class="bottom">
    <div><div class="lbl">Стадион</div><div class="val">$stadium</div></div>
    <div><div class="lbl">В таблице</div><div class="val">$table</div></div>
    <div><div class="lbl">Форма Комо</div><div class="form">$form</div></div>
  </div>
</body></html>
