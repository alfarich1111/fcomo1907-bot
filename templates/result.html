<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .cut.r { right: 0; width: 900px; height: 1100px; top: 560px; }
  .k2 { position: absolute; top: 606px; left: 96px; font-size: 34px; font-weight: 800; letter-spacing: 10px;
    text-transform: uppercase; color: #cfe3ff; }
  .h1 { position: absolute; top: 650px; left: 88px; font-size: $hl_size; font-weight: 900; letter-spacing: -8px;
    text-transform: uppercase; line-height: 1; white-space: nowrap; }
  .h2 { position: absolute; top: 840px; left: 96px; font-size: 104px; font-weight: 900; letter-spacing: -4px;
    text-transform: uppercase; line-height: 1; color: #a8d0ff; white-space: nowrap; }
  .goals { position: absolute; top: 1066px; left: 96px; width: 696px; background: #13235a; border-radius: 28px;
    padding: 40px 44px 34px; box-shadow: 0 24px 60px rgba(8,20,70,.35); }
  .goals .lbl { font-size: 24px; font-weight: 800; letter-spacing: 5px; text-transform: uppercase; color: #cfe3ff; margin-bottom: 18px; }
  .goal { display: flex; align-items: center; font-size: 42px; font-weight: 700; height: 77px; }
  .goal .dot { width: 18px; height: 18px; border-radius: 50%; margin-right: 26px; flex: none; }
  .goal .min { width: 160px; font-weight: 900; flex: none; }
  .goal .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .goal.opp .who { color: #a9b3c9; }
</style></head>
<body>
  <div class="top"><div class="day">$weekday</div>
    <div class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>@fcomo1907</div>
    <div class="date">$date</div></div>
  <div class="rule" style="top:216px"></div>
  <div class="kicker" style="top:254px">$kicker</div>
  <div class="board">
    <div class="team $home_dim"><div class="logo"><img src="$home_logo"></div><div class="name">$home</div></div>
    <div class="center"><div class="big">$score</div><div class="small">Финал</div></div>
    <div class="team right $away_dim"><div class="logo"><img src="$away_logo"></div><div class="name">$away</div></div>
  </div>
  $right_img
  <div class="k2">$k2</div>
  <div class="h1">$hl1</div>
  <div class="h2">$hl2</div>
  <div class="goals"><div class="lbl">Голы</div>$goals</div>
  <div class="rule" style="top:1712px"></div>
  <div class="bottom">
    <div><div class="lbl">В таблице</div><div class="val">$table</div></div>
    <div><div class="lbl">Серия</div><div class="val">$series</div></div>
    <div><div class="lbl">Форма Комо</div><div class="form">$form</div></div>
  </div>
</body></html>
