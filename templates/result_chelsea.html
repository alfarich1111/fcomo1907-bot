<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="chelsea.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=block">
<style>
  /* 433-style result: full-bleed match photo, dark fade at the bottom, huge heavy score over it. */
  body { background: #020a1f; }
  .photo { position: absolute; inset: 0; width: 1600px; height: 2000px; object-fit: cover; object-position: center 25%; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(2,10,31,.28), transparent 14%, transparent 50%, rgba(2,10,31,.88) 74%, #020a1f 100%); }
  .comp-logo { position: absolute; top: 60px; right: 70px; height: 130px; max-width: 240px; object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
  .res { position: absolute; left: 70px; right: 70px; bottom: 150px; color: #fff; text-align: center; }
  .ft { font-size: 34px; font-weight: 800; letter-spacing: 10px; text-transform: uppercase; color: #e5b43b; }
  .line { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 18px; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .team .c { width: 170px; height: 170px; border-radius: 50%; background: #fff; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 12px 36px rgba(0,0,0,.5); }
  .team .c img { width: 124px; height: 124px; object-fit: contain; }
  .team .n { font-size: 40px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
  .score { font-family: 'Anton', Impact, sans-serif; font-size: 340px; line-height: 1.05; padding: 0 30px; white-space: nowrap;
    letter-spacing: 6px; text-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .score i { font-style: normal; color: #e5b43b; padding: 0 18px; }
  .scorers { margin-top: 16px; font-size: $scorers_fs; font-weight: 700; line-height: 1.3; }
  .brand { position: absolute; left: 0; right: 0; bottom: 50px; height: auto; justify-content: center; }
  .brand .tag { height: 50px; }
</style></head>
<body>
  $photo
  <div class="shade"></div>
  $comp_logo
  <div class="res">
    <div class="ft">O'yin yakunlandi</div>
    <div class="line">
      <div class="team"><div class="c"><img src="$home_logo"></div><div class="n">$home</div></div>
      <div class="score">$score_h<i>-</i>$score_a</div>
      <div class="team"><div class="c"><img src="$away_logo"></div><div class="n">$away</div></div>
    </div>
    <div class="scorers">$scorers</div>
  </div>
  <div class="brand"><img class="tag" src="../assets/cfc_uz_at.png"></div>
</body></html>
