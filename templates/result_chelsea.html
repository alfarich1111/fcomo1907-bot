<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="chelsea.css">
<style>
  /* Team photo across the middle, fading into the background at the top and bottom. */
  .photo { position: absolute; left: 0; top: 600px; width: 1600px; height: 1000px; object-fit: cover; object-position: center 30%;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 66%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 66%, transparent 100%); }
  .ft { position: absolute; top: 230px; left: 0; right: 0; text-align: center; }
  .ft .tag { display: inline-block; background: #e5b43b; color: #021c4f; font-weight: 900; font-size: 28px;
    letter-spacing: 10px; padding: 12px 38px; border-radius: 10px; text-transform: uppercase; }
  .ft .comp { margin-top: 18px; font-size: 24px; font-weight: 800; letter-spacing: 8px; text-transform: uppercase; opacity: .85; }
  .board { left: 80px; right: 80px; top: 400px; height: 210px; display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; padding: 0 40px; z-index: 2; }
  .team { display: flex; align-items: center; gap: 26px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; white-space: nowrap; }
  .team.r { justify-content: flex-end; }
  .team.dim { opacity: .55; }
  .logo { width: 116px; height: 116px; flex: none; background: #fff; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 0 0 5px rgba(229,180,59,.8); }
  .logo img { width: 82px; height: 82px; object-fit: contain; }
  .score { font-family: 'Bebas Neue', sans-serif; font-size: 210px; line-height: 1; padding: 0 36px; letter-spacing: 6px; }
  .score i { font-style: normal; color: #e5b43b; }
  .head { position: absolute; left: 80px; right: 80px; top: 1430px; }
  .head .k2 { font-size: 28px; font-weight: 800; letter-spacing: 9px; color: #e5b43b; text-transform: uppercase; }
  .head .hl { font-size: $hl_size; margin-top: 12px; white-space: nowrap; }
  .head .hl span { color: #9cc3ff; }
  .bottom { position: absolute; left: 80px; right: 80px; top: 1745px; display: grid; grid-template-columns: 1.3fr 1fr .9fr; gap: 30px; }
  .bottom .val.goals { white-space: normal; font-size: $scorers_fs; line-height: 1.25; }
</style></head>
<body>
  <img class="crest-wm" src="../assets/cfc_uz_logo.png">
  $photo
  <img class="photo-mark" src="../assets/cfc_uz_at.png">
  <div class="topbar">
    <div class="brand"><img class="lg" src="../assets/cfc_uz_logo.png"><img class="pill" src="../assets/cfc_uz_pill.png"></div>
    <div class="when">$date<small>$weekday</small></div>
  </div>
  <div class="goldline" style="top:196px"></div>
  <div class="ft"><div class="tag">Uchrashuv yakunlandi</div><div class="comp">$kicker</div></div>
  <div class="panel board">
    <div class="team $home_dim"><div class="logo"><img src="$home_logo"></div><span style="font-size:$home_fs">$home</span></div>
    <div class="score">$score_h<i>:</i>$score_a</div>
    <div class="team r $away_dim"><span style="font-size:$away_fs">$away</span><div class="logo"><img src="$away_logo"></div></div>
  </div>
  <div class="head"><div class="k2">$k2</div><div class="hl display">$hl1 <span>$hl2</span></div></div>
  <div class="goldline" style="top:1700px"></div>
  <div class="bottom">
    <div class="stat"><div class="lbl">$l_goals</div><div class="val goals">$scorers</div></div>
    <div class="stat"><div class="lbl">$l_table</div><div class="val">$table</div></div>
    <div class="stat"><div class="lbl">$l_form</div><div class="chips">$form</div></div>
  </div>
  <img class="foot" src="../assets/cfc_uz_link.png">
</body></html>
