<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="chelsea.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=block">
<style>
  /* Full-bleed match photo with the result written on top of it (no poster background). */
  body { background: #021c4f; }
  .photo { position: absolute; inset: 0; width: 1600px; height: 2000px; object-fit: cover; object-position: center 25%; }
  .shade { position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 45% at 88% 12%, rgba(2,12,40,.55), transparent 70%),
                linear-gradient(to bottom, rgba(2,12,40,.35), transparent 22%, transparent 78%, rgba(2,12,40,.55)); }
  .brand { position: absolute; top: 60px; left: 70px; }
  .brand .lg { width: 150px; height: 150px; filter: drop-shadow(0 8px 20px rgba(0,0,0,.5)); }
  .res { position: absolute; top: 70px; right: 90px; width: 640px; text-align: center; color: #fff;
    text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  .crests { display: flex; justify-content: center; gap: 46px; }
  .crests img { width: 190px; height: 190px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(0,0,0,.45)); }
  .score { font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 330px; line-height: 1; margin-top: 30px;
    letter-spacing: 4px; }
  .score i { font-style: normal; display: inline-block; padding: 0 26px; transform: translateY(-14px); font-weight: 400; }
  .ft { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 92px; line-height: 1; margin-top: 6px;
    letter-spacing: 2px; text-transform: uppercase; }
  .comp-logo { position: absolute; right: 80px; bottom: 70px; height: 150px; max-width: 280px; object-fit: contain;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,.5)); }
</style></head>
<body>
  $photo
  <div class="shade"></div>
  <div class="brand"><img class="lg" src="../assets/cfc_uz_logo.png"></div>
  <div class="res">
    <div class="crests"><img src="$home_logo"><img src="$away_logo"></div>
    <div class="score">$score_h<i>–</i>$score_a</div>
    <div class="ft">Full-time</div>
  </div>
  $comp_logo
</body></html>
